<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomo Gogo</title>
  <meta name="description" content="A simple Pomodoro timer.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍅</text></svg>">
  <style>
    :root {
      --bg: #fdf6f3;
      --fg: #2b1d1a;
      --muted: #7a6560;
      --card: #ffffff;
      --accent: #d9483b;
      --track: #f0e2dd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1413;
        --fg: #f5ebe8;
        --muted: #b09a95;
        --card: #241c1a;
        --track: #3a2e2b;
      }
    }
    body.short { --accent: #3b9c6e; }
    body.long  { --accent: #3b6fd9; }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: background .3s;
    }
    main {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      text-align: center;
    }
    h1 { margin: 0 0 20px; font-size: 1.4rem; }
    main { position: relative; }
    .stats-link {
      position: absolute; top: 20px; right: 18px; text-decoration: none; font-size: 1.1rem;
      width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; background: var(--track);
    }
    .modes { display: flex; gap: 6px; justify-content: center; margin-bottom: 24px; }
    .modes button {
      flex: 1;
      border: 0;
      padding: 8px 6px;
      border-radius: 999px;
      background: var(--track);
      color: var(--fg);
      font: inherit;
      font-size: .9rem;
      cursor: pointer;
    }
    .modes button[aria-pressed="true"] { background: var(--accent); color: #fff; }
    .ring { position: relative; width: 240px; height: 240px; margin: 0 auto 24px; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 10; }
    .ring .track { stroke: var(--track); }
    .ring .progress { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
    .time {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .time strong { font-size: 3.4rem; font-variant-numeric: tabular-nums; }
    .time span { color: var(--muted); font-size: .9rem; }
    #current-task .dot { display: inline-block; margin-right: 5px; vertical-align: middle; }
    #current-task { max-width: 170px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
    .controls { display: flex; gap: 10px; justify-content: center; }
    .controls button {
      border: 0; border-radius: 12px; padding: 12px 22px;
      font: inherit; font-weight: 600; cursor: pointer;
    }
    #start { background: var(--accent); color: #fff; min-width: 120px; }
    .secondary { background: var(--track); color: var(--fg); }
    details { margin-top: 24px; text-align: left; }
    summary { cursor: pointer; color: var(--muted); }
    .manage-title { font-size: .9rem; margin: 18px 0 6px; }
    .manage { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
    .manage li { display: flex; align-items: center; gap: 8px; font-size: .9rem; }
    .manage li span.name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .manage li small { color: var(--muted); white-space: nowrap; }
    .manage button { border: 0; background: var(--track); color: var(--fg); border-radius: 6px; width: 26px; height: 26px; cursor: pointer; font: inherit; }
    .settings { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 12px; align-items: center; }
    .settings input[type=number] {
      width: 72px; padding: 6px; border-radius: 8px;
      border: 1px solid var(--track); background: var(--bg); color: var(--fg); font: inherit;
    }
    .env-badge {
      position: fixed; top: 0; left: 50%; transform: translateX(-50%);
      padding: 4px 14px; border-radius: 0 0 10px 10px;
      font-size: .75rem; font-weight: 700; letter-spacing: .08em; color: #fff;
    }
    .env-badge.dev { background: #7a3bd9; }
    .env-badge.sandbox { background: #d98a1b; }
    .count { margin-top: 18px; color: var(--muted); font-size: .9rem; }
    .count a { color: var(--fg); }
    .tasks { margin-top: 24px; text-align: left; }
    .tasks h2 { font-size: 1rem; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline; }
    .tasks h2 small { color: var(--muted); font-weight: 400; font-size: .8rem; }
    .add { display: flex; gap: 6px; margin-bottom: 10px; }
    .add input {
      min-width: 0; padding: 8px; border-radius: 8px;
      border: 1px solid var(--track); background: var(--bg); color: var(--fg); font: inherit;
    }
    .add input[type=text] { flex: 1 1 100%; }
    .add .pick { flex: 1 1 100%; }
    .add input[type=number] { margin-left: auto; }
    .pick { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .pick .chip { padding: 3px 8px; font-size: .75rem; }
    .pick .chip[aria-pressed="true"] { background: var(--chip, var(--track)); border-color: var(--chip, var(--fg)); color: #fff; }
    .pick .chip[aria-pressed="true"] .dot { background: #fff !important; }
    .pick .chip .x { opacity: .8; margin-left: 2px; }
    .pick select.chip { appearance: none; -webkit-appearance: none; border-style: dashed; color: var(--muted); max-width: 120px; }
    .pick .none { color: var(--muted); font-size: .75rem; }
    .task-main { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
    .task-main .task-title { flex: 1 1 90px; min-width: 0; }
    .task-title[contenteditable] { cursor: text; border-radius: 4px; outline: none; padding: 0 2px; margin: 0 -2px; }
    .task-title[contenteditable]:hover { box-shadow: inset 0 -1px 0 var(--muted); }
    .task-title[contenteditable]:focus { background: var(--card); box-shadow: 0 0 0 2px var(--accent); text-decoration: none; color: var(--fg); }
    .inline-pick { gap: 4px; }
    .grip {
      flex: none; align-self: stretch; width: 18px; margin: -10px 0 -10px -10px; padding: 0;
      border: 0; background: none; color: var(--muted); font-size: 1rem; line-height: 1;
      cursor: grab; touch-action: none; opacity: .55;
    }
    .grip:hover, .grip:focus-visible { opacity: 1; }
    .task.dragging { opacity: .85; box-shadow: 0 8px 24px rgba(0,0,0,.25); position: relative; z-index: 1; }
    .task.dragging .grip { cursor: grabbing; }
    .est { cursor: text; border-radius: 4px; padding: 0 3px; outline: none; box-shadow: inset 0 -1px 0 var(--muted); }
    .est:focus { background: var(--card); box-shadow: 0 0 0 2px var(--accent); color: var(--fg); }
    .inline-pick { flex-wrap: nowrap; min-width: 0; }
    .inline-pick .chip { padding: 1px 7px; font-size: .7rem; gap: 4px; flex: none; white-space: nowrap; }
    .inline-pick .chip .nm { display: inline-block; max-width: 6.5em; overflow: hidden; text-overflow: ellipsis; }
    .inline-pick select.chip { padding: 1px 6px; max-width: 90px; }
    .task > .pick { flex-basis: 100%; padding-top: 4px; border-top: 1px dashed var(--track); }
    .add select {
      min-width: 0; padding: 8px 4px; border-radius: 8px;
      border: 1px solid var(--track); background: var(--bg); color: var(--fg); font: inherit; font-size: .85rem;
    }
    .add { flex-wrap: wrap; }
    .projects { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--track); border-radius: 999px; padding: 4px 10px;
      background: none; color: var(--fg); font: inherit; font-size: .8rem; cursor: pointer;
    }
    .chip[aria-pressed="true"] { background: var(--track); border-color: var(--fg); }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--muted); }
    .group { margin-top: 12px; }
    .group:first-child { margin-top: 0; }
    .group-head {
      display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
      font-size: .85rem; font-weight: 600;
    }
    .group-head .group-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .group-head small { color: var(--muted); font-weight: 400; white-space: nowrap; }
    .group-head button {
      border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; padding: 0 2px;
    }
    .group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .task { padding-left: 14px; }
    .add input[type=number] { width: 56px; }
    .add button, .task-actions button {
      border: 0; border-radius: 8px; background: var(--track); color: var(--fg);
      font: inherit; cursor: pointer;
    }
    .add button { padding: 8px 12px; background: var(--accent); color: #fff; font-weight: 600; }
    #task-list { margin: 0; padding: 0; }
    .task {
      display: flex; align-items: center; gap: 8px;
      padding: 10px; border-radius: 10px; border: 2px solid transparent; background: var(--bg);
      cursor: pointer;
    }
    .task.active { border-color: var(--cat, var(--accent)); }
    .task.done .task-title { text-decoration: line-through; color: var(--muted); }
    .task input[type=checkbox] { flex: none; width: 18px; height: 18px; accent-color: var(--accent); }
    .task-title { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .task-count { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .task-count.over { color: var(--accent); }
    .task-actions { display: flex; gap: 4px; }
    .task-actions button { width: 26px; height: 26px; padding: 0; font-size: .9rem; }
    @media (max-width: 480px) {
      .task { flex-wrap: wrap; row-gap: 6px; }
      .task-main { flex-basis: calc(100% - 56px); }
      .task input[type=checkbox] { margin: 0; }
      .task-count { margin-left: 42px; flex: 1; }
    }
    .empty { color: var(--muted); font-size: .9rem; text-align: center; padding: 8px; }
    .task-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; color: var(--muted); font-size: .85rem; flex-wrap: wrap; }
    .task-foot button { border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; padding: 0; }
  </style>
</head>
<body>
  <main>
    <a class="stats-link" href="stats.html" title="Stats" aria-label="Stats">📊</a>
    <h1>🍅 Pomo Gogo</h1>
    <div class="modes" role="group" aria-label="Mode">
      <button data-mode="work" aria-pressed="true">Focus</button>
      <button data-mode="short" aria-pressed="false">Short break</button>
      <button data-mode="long" aria-pressed="false">Long break</button>
    </div>
    <div class="ring">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="54"></circle>
        <circle class="progress" cx="60" cy="60" r="54"></circle>
      </svg>
      <div class="time">
        <strong id="clock" aria-live="polite">25:00</strong>
        <span id="label">Focus</span>
        <span id="current-task"></span>
      </div>
    </div>
    <div class="controls">
      <button id="start">Start</button>
      <button id="reset" class="secondary">Reset</button>
      <button id="skip" class="secondary" title="Skip to next">Skip</button>
    </div>
    <p class="count">Completed pomodoros: <span id="done">0</span> · <a href="stats.html">📊 Stats</a></p>
    <section class="tasks" aria-label="Task plan">
      <h2>Plan <small id="plan-summary"></small></h2>
      <div class="projects" id="projects" role="group" aria-label="Filter by project"></div>
      <form class="add" id="add-form">
        <input id="task-title" type="text" placeholder="What are you working on?" aria-label="Task" required>
        <div class="pick" id="task-cats" role="group" aria-label="Projects for the new task (pick any)"></div>
        <input id="task-est" type="number" min="1" max="20" value="1" aria-label="Estimated pomodoros" title="Estimated pomodoros">
        <button type="submit">Add</button>
      </form>
      <div id="task-list"></div>
      <div class="task-foot">
        <span id="finish-at"></span>
        <button id="clear-done" type="button">Clear finished</button>
      </div>
    </section>
    <details>
      <summary>Settings</summary>
      <div class="settings">
        <label for="s-work">Focus (min)</label><input id="s-work" type="number" min="1" max="120">
        <label for="s-short">Short break (min)</label><input id="s-short" type="number" min="1" max="60">
        <label for="s-long">Long break (min)</label><input id="s-long" type="number" min="1" max="60">
        <label for="s-every">Long break every</label><input id="s-every" type="number" min="2" max="10">
        <label for="s-auto">Auto-start next</label><input id="s-auto" type="checkbox">
      </div>
      <h3 class="manage-title">Projects</h3>
      <ul id="manage-projects" class="manage"></ul>
    </details>
  </main>

  <script>
    // Environment badge: DEV when served locally, SANDBOX on the sandbox Pages site, nothing on prod.
    const ENV = (() => {
      const h = location.hostname;
      const env = location.protocol === 'file:' || h === 'localhost' || h === '127.0.0.1' || h.endsWith('.local') ? 'dev'
        : location.pathname.startsWith('/pomo-gogo-sandbox') ? 'sandbox' : null;
      if (!env) return '';
      const b = document.createElement('div');
      b.className = 'env-badge ' + env;
      b.textContent = env.toUpperCase();
      document.body.prepend(b);
      return '[' + env.toUpperCase() + '] ';
    })();

    const LABELS = { work: 'Focus', short: 'Short break', long: 'Long break' };
    const DEFAULTS = { work: 25, short: 5, long: 15, every: 4, auto: false };

    function load(key, fallback) {
      try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; }
    }
    function save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    }

    const settings = { ...DEFAULTS, ...load('pomo-settings', {}) };
    let mode = 'work';
    let remaining = settings.work * 60;
    let endAt = null;
    let tick = null;
    let done = load('pomo-done', 0);
    let tasks = load('pomo-tasks', []);
    let activeId = load('pomo-active', null);
    const CAT_COLORS = ['#d9483b', '#3b6fd9', '#3b9c6e', '#d98a1b', '#8a3bd9', '#1b9fb3', '#c23b8a', '#6b7d2a'];
    // Projects (categories). `logged` counts every focus session ever credited to the project, even after tasks are cleared.
    let cats = load('pomo-cats', null) || [
      { id: 'interview', name: 'Interview prep', color: CAT_COLORS[0], logged: 0 },
      { id: 'neetcode', name: 'NeetCode', color: CAT_COLORS[1], logged: 0 },
      { id: 'trustanchor', name: 'TrustAnchor', color: CAT_COLORS[2], logged: 0 },
    ];
    let filterCat = load('pomo-filter', 'all');   // 'all' | category id | 'none'
    // A task can belong to several projects: t.cats is a list of project ids (older saves used a single t.cat).
    tasks.forEach(t => { if (!Array.isArray(t.cats)) { t.cats = t.cat ? [t.cat] : []; delete t.cat; } });
    let newCats = load('pomo-newcats', null);       // projects preselected in the add form

    const $ = (id) => document.getElementById(id);
    const progress = document.querySelector('.progress');
    const CIRC = 2 * Math.PI * 54;
    progress.style.strokeDasharray = CIRC;

    function total() { return settings[mode] * 60; }
    function fmt(s) {
      const m = Math.floor(s / 60), r = s % 60;
      return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
    }

    function render() {
      $('clock').textContent = fmt(remaining);
      $('label').textContent = LABELS[mode];
      $('done').textContent = done;
      const active = activeTask();
      const cur = $('current-task');
      cur.textContent = '';
      if (active && mode === 'work') {
        const cs = catsOf(active);
        cs.forEach(c => { const d = document.createElement('span'); d.className = 'dot'; d.style.background = c.color; cur.append(d); });
        cur.append(active.title);
        cur.title = (cs.length ? cs.map(c => c.name).join(', ') + ' · ' : '') + active.title;
      }
      if ($('finish-at')) renderPlanStats();
      $('start').textContent = tick ? 'Pause' : 'Start';
      progress.style.strokeDashoffset = CIRC * (1 - remaining / total());
      document.body.className = mode === 'work' ? '' : mode;
      document.title = ENV + (tick ? fmt(remaining) + ' · ' : '') + LABELS[mode] + ' — Pomo Gogo';
      document.querySelectorAll('.modes button').forEach(b =>
        b.setAttribute('aria-pressed', b.dataset.mode === mode));
    }

    function start() {
      if (tick) return;
      endAt = Date.now() + remaining * 1000;
      tick = setInterval(step, 250);
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
      render();
    }
    function pause() {
      clearInterval(tick);
      tick = null;
      render();
    }
    function step() {
      remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000));
      if (remaining === 0) finish();
      else render();
    }

    function setMode(m) {
      pause();
      mode = m;
      remaining = total();
      render();
    }

    function next() {
      if (mode === 'work') {
        setMode(done % settings.every === 0 && done > 0 ? 'long' : 'short');
      } else {
        setMode('work');
      }
    }

    // Every completed focus session is appended to `pomo-log` for the stats page.
    function logSession(task, at = Date.now(), manual = false) {
      const log = load('pomo-log', []);
      const entry = {
        at,
        min: settings.work,
        task: task ? task.title : null,
        taskId: task ? task.id : null,
        cats: task ? catsOf(task).map(c => c.id) : [],
      };
      if (manual) entry.manual = true;
      log.push(entry);
      save('pomo-log', log);
    }

    // Record pomodoros done without the timer: `count` sessions, the last one finishing at `endAt`.
    function logManual(task, count, endAt) {
      for (let k = count - 1; k >= 0; k--) {
        logSession(task, endAt - k * (settings.work + settings.short) * 60000, true);
      }
      task.spent += count;
      catsOf(task).forEach(c => { c.logged = (c.logged || 0) + count; });
      done += count; save('pomo-done', done);
      saveTasks(); render();
    }

    function finish() {
      const finished = mode;
      if (finished === 'work') {
        done++; save('pomo-done', done);
        const active = activeTask();
        logSession(active);
        if (active) {
          active.spent++;
          catsOf(active).forEach(c => { c.logged = (c.logged || 0) + 1; });
          saveTasks();
        }
      }
      beep();
      notify(finished === 'work' ? 'Focus session done — take a break!' : 'Break over — back to focus!');
      next();
      if (settings.auto) start();
    }

    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.35, 0.7].forEach(t => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.frequency.value = 880;
          g.gain.setValueAtTime(0.2, ctx.currentTime + t);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.3);
          o.connect(g).connect(ctx.destination);
          o.start(ctx.currentTime + t);
          o.stop(ctx.currentTime + t + 0.3);
        });
      } catch {}
    }
    function notify(text) {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('Pomo Gogo', { body: text });
      }
    }

    $('start').onclick = () => (tick ? pause() : start());
    $('reset').onclick = () => setMode(mode);
    $('skip').onclick = () => next();
    document.querySelectorAll('.modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));

    const fields = { work: 's-work', short: 's-short', long: 's-long', every: 's-every' };
    for (const [key, id] of Object.entries(fields)) {
      const el = $(id);
      el.value = settings[key];
      el.onchange = () => {
        const v = parseInt(el.value, 10);
        if (!(v >= +el.min && v <= +el.max)) { el.value = settings[key]; return; }
        settings[key] = v;
        save('pomo-settings', settings);
        if (!tick && key === mode) { remaining = total(); render(); }
      };
    }
    $('s-auto').checked = settings.auto;
    $('s-auto').onchange = (e) => { settings.auto = e.target.checked; save('pomo-settings', settings); };

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !e.target.isContentEditable && !['INPUT', 'BUTTON', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) {
        e.preventDefault();
        tick ? pause() : start();
      }
    });

    // ---- Task plan ----
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    function catsOf(t) { return cats.filter(c => t.cats.includes(c.id)); }
    const hasCat = (t, id) => t.cats.includes(id);
    const noCat = (t) => !catsOf(t).length;
    function activeTask() { return tasks.find(t => t.id === activeId && !t.done) || null; }
    function saveTasks() {
      save('pomo-tasks', tasks); save('pomo-active', activeId);
      save('pomo-cats', cats); save('pomo-filter', filterCat); save('pomo-newcats', newCats);
      renderTasks();
    }
    function inFilter(t) {
      return filterCat === 'all' || (filterCat === 'none' ? noCat(t) : hasCat(t, filterCat));
    }
    // Keep the current task if still open; otherwise prefer the next open task in the same project, then the filter, then anything.
    function pickNextActive(preferCats = []) {
      if (activeTask()) return;
      const open = tasks.filter(t => !t.done);
      const next = open.find(t => t.cats.some(id => preferCats.includes(id))) || open.find(inFilter) || open[0];
      activeId = next ? next.id : null;
    }

    // Creates a project (or reuses one with the same name, ignoring case). Returns its id, or null if cancelled.
    function addProject() {
      const name = (prompt('New project name (e.g. System design):') || '').trim();
      if (!name) return null;
      const existing = cats.find(c => c.name.toLowerCase() === name.toLowerCase());
      if (existing) return existing.id;
      const used = new Set(cats.map(c => c.color));
      const color = CAT_COLORS.find(col => !used.has(col)) || CAT_COLORS[cats.length % CAT_COLORS.length];
      const c = { id: uid(), name, color, logged: 0 };
      cats.push(c);
      save('pomo-cats', cats);
      return c.id;
    }
    function renameProject(c) {
      const name = (prompt('Rename project:', c.name) || '').trim();
      if (!name) return;
      if (cats.some(x => x !== c && x.name.toLowerCase() === name.toLowerCase())) { alert('A project named "' + name + '" already exists.'); return; }
      c.name = name; saveTasks(); render();
    }
    function deleteProject(c) {
      const n = tasks.filter(t => hasCat(t, c.id)).length;
      if (!confirm('Delete project "' + c.name + '"?' + (n ? ' It is removed from ' + n + ' task(s); tasks with no other project move to "No project".' : ''))) return;
      tasks.forEach(t => { t.cats = t.cats.filter(id => id !== c.id); });
      cats = cats.filter(x => x !== c);
      if (newCats) newCats = newCats.filter(id => id !== c.id);
      if (filterCat === c.id) filterCat = 'all';
      saveTasks(); render();
    }

    function renderProjects() {
      const inUse = cats.filter(c => tasks.some(t => hasCat(t, c.id)));
      if (filterCat === 'none' ? !tasks.some(noCat) : filterCat !== 'all' && !inUse.some(c => c.id === filterCat)) filterCat = 'all';
      const bar = $('projects');
      bar.innerHTML = '';
      const chip = (id, label, color) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'chip';
        b.setAttribute('aria-pressed', filterCat === id);
        if (color !== undefined) { const d = document.createElement('span'); d.className = 'dot'; if (color) d.style.background = color; b.append(d); }
        b.append(label);
        b.onclick = () => {
          filterCat = id;
          if (cats.some(c => c.id === id) && !newCats.includes(id)) newCats = [id];
          saveTasks();
        };
        return b;
      };
      // Only projects that are on at least one task are offered as filters.
      bar.append(chip('all', 'All'));
      inUse.forEach(c => bar.append(chip(c.id, c.name, c.color)));
      if (tasks.some(noCat) && inUse.length) bar.append(chip('none', 'No project', ''));
      bar.hidden = !inUse.length;
      renderManage();

      // Project picker in the add form: remembers the last selection; defaults to the filtered project.
      if (newCats === null) newCats = [];
      newCats = newCats.filter(id => cats.some(c => c.id === id));
      const box = $('task-cats');
      box.innerHTML = '';
      box.append(projectPicker(newCats, (ids) => { newCats = ids; save('pomo-newcats', newCats); renderProjects(); }));
    }

    function renderManage() {
      const ul = $('manage-projects');
      ul.innerHTML = '';
      if (!cats.length) ul.innerHTML = '<li class="empty">No projects yet — add one from a task’s “+ Project” menu.</li>';
      cats.forEach(c => {
        const li = document.createElement('li');
        const d = document.createElement('span'); d.className = 'dot'; d.style.background = c.color;
        const name = document.createElement('span'); name.className = 'name'; name.textContent = c.name;
        const n = tasks.filter(t => hasCat(t, c.id)).length;
        const meta = document.createElement('small');
        meta.textContent = (n ? n + ' task' + (n > 1 ? 's' : '') : 'unused') + (c.logged ? ' · ' + c.logged + ' 🍅' : '');
        const mk = (label, aria, fn) => {
          const b = document.createElement('button'); b.type = 'button';
          b.textContent = label; b.title = aria; b.setAttribute('aria-label', aria + ' ' + c.name); b.onclick = fn;
          return b;
        };
        li.append(d, name, meta, mk('✎', 'Rename', () => renameProject(c)), mk('✕', 'Delete', () => deleteProject(c)));
        ul.append(li);
      });
    }

    // Shows only the selected projects (tap one to remove it); a "+ Project" menu lists the others.
    function projectPicker(selected, onChange, compact = false) {
      const frag = document.createDocumentFragment();
      const chosen = cats.filter(c => selected.includes(c.id));
      chosen.forEach(c => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'chip';
        b.setAttribute('aria-pressed', 'true');
        b.style.setProperty('--chip', c.color);
        b.title = 'Remove ' + c.name;
        b.setAttribute('aria-label', 'Remove project ' + c.name);
        const d = document.createElement('span'); d.className = 'dot';
        const x = document.createElement('span'); x.className = 'x'; x.textContent = '✕';
        const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = c.name;
        b.append(d, nm, x);
        b.onclick = (e) => { e.stopPropagation(); onChange(selected.filter(id => id !== c.id)); };
        frag.append(b);
      });
      if (!chosen.length && !compact) {
        const n = document.createElement('span'); n.className = 'none'; n.textContent = 'No project';
        frag.append(n);
      }
      const rest = cats.filter(c => !selected.includes(c.id));
      const sel = document.createElement('select');
      sel.className = 'chip';
      sel.setAttribute('aria-label', 'Add a project');
      sel.add(new Option(compact ? '+' : '+ Project', ''));
      if (compact) { sel.title = 'Add a project'; sel.style.width = '2.2em'; sel.style.textAlign = 'center'; }
      rest.forEach(c => sel.add(new Option(c.name, c.id)));
      sel.add(new Option('New project…', '__new'));
      sel.onclick = (e) => e.stopPropagation();
      sel.onchange = () => {
        const id = sel.value === '__new' ? addProject() : sel.value;
        if (id && !selected.includes(id)) onChange([...selected, id]);
        else sel.value = '';
      };
      frag.append(sel);
      return frag;
    }

    // Left stripe: one color per project the task belongs to.
    function stripe(cs) {
      const step = 100 / cs.length;
      return 'linear-gradient(to bottom, ' + cs.map((c, k) => c.color + ' ' + (k * step) + '% ' + ((k + 1) * step) + '%').join(', ') + ')';
    }

    // Tap a task's name to rename it in place. Enter or blur saves, Esc cancels.
    // Saving doesn't rebuild the list, so a click that caused the blur still lands.
    function editableTitle(el, t, li) {
      el.contentEditable = 'plaintext-only';
      if (el.contentEditable !== 'plaintext-only') el.contentEditable = 'true';
      el.spellcheck = false;
      el.setAttribute('role', 'textbox');
      el.setAttribute('aria-label', 'Task name');
      el.onclick = (e) => {
        e.stopPropagation();
        if (!t.done && activeId !== t.id) {
          activeId = t.id; save('pomo-active', activeId);
          document.querySelectorAll('.task.active').forEach(x => x.classList.remove('active'));
          document.querySelectorAll('.task').forEach(x => { if (x.dataset.id === t.id) x.classList.add('active'); });
          render();
        }
      };
      el.onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
        if (e.key === 'Escape') { el.textContent = t.title; el.blur(); }
      };
      el.onblur = () => {
        const v = el.textContent.replace(/\s+/g, ' ').trim();
        if (!v) { el.textContent = t.title; return; }
        if (v === t.title) return;
        t.title = v;
        save('pomo-tasks', tasks);
        document.querySelectorAll('.task').forEach(x => { if (x.dataset.id === t.id) x.querySelector('.task-title').textContent = v; });
        render();
      };
    }

    // Tap the estimate (the "3" in "1/3 🍅") to change it in place: 1–20.
    function editableEstimate(el, t, count) {
      el.contentEditable = 'true';
      el.spellcheck = false;
      el.inputMode = 'numeric';
      el.setAttribute('role', 'textbox');
      el.setAttribute('aria-label', 'Estimated pomodoros');
      el.title = 'Tap to change the estimate';
      el.onclick = (e) => e.stopPropagation();
      el.onfocus = () => { const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); };
      el.onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
        else if (e.key === 'Escape') { el.textContent = t.est; el.blur(); }
        else if (e.key.length === 1 && !/[0-9]/.test(e.key) && !e.metaKey && !e.ctrlKey) e.preventDefault();
      };
      el.onblur = () => {
        const v = parseInt(el.textContent, 10);
        if (!(v >= 1)) { el.textContent = t.est; return; }
        t.est = Math.min(20, v);
        save('pomo-tasks', tasks);
        document.querySelectorAll('.task').forEach(x => {
          if (x.dataset.id !== t.id) return;
          x.querySelector('.est').textContent = t.est;
          x.querySelector('.task-count').classList.toggle('over', t.spent > t.est);
        });
        renderPlanStats();
        document.querySelectorAll('.group-stats').forEach(groupStatsText);
      };
    }

    function taskItem(t, groupId) {
      const i = tasks.indexOf(t);
      const cs = catsOf(t);
      const li = document.createElement('li');
      li.className = 'task' + (t.id === activeId && !t.done ? ' active' : '') + (t.done ? ' done' : '');
      li.dataset.id = t.id;
      const own = cs.find(c => c.id === groupId) || cs[0];
      if (own) li.style.setProperty('--cat', own.color);
      if (cs.length) li.style.background = stripe(cs) + ' left top / 5px 100% no-repeat, var(--bg)';
      li.title = t.done ? '' : 'Click to make this the current task';

      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = t.done; cb.setAttribute('aria-label', 'Mark finished');
      cb.onclick = (e) => e.stopPropagation();
      cb.onchange = () => { t.done = cb.checked; pickNextActive(t.cats); saveTasks(); render(); };

      const main = document.createElement('span');
      main.className = 'task-main';
      const title = document.createElement('span');
      title.className = 'task-title'; title.textContent = t.title;
      editableTitle(title, t, li);
      // Projects are edited in place: tap a tag's ✕ to remove it, "+" to add one.
      const tags = document.createElement('span');
      tags.className = 'pick inline-pick';
      tags.onclick = (e) => e.stopPropagation();
      tags.append(projectPicker(t.cats, (ids) => { t.cats = ids; saveTasks(); render(); }, true));
      main.append(tags, title);

      const count = document.createElement('span');
      count.className = 'task-count' + (t.spent > t.est ? ' over' : '');
      const est = document.createElement('span');
      est.className = 'est'; est.textContent = t.est;
      editableEstimate(est, t, count);
      count.append(t.spent + '/', est);
      count.title = 'Pomodoros done / estimated';

      const actions = document.createElement('span');
      actions.className = 'task-actions';
      const btn = (label, aria, fn) => {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = label; b.setAttribute('aria-label', aria); b.title = aria;
        b.onclick = (e) => { e.stopPropagation(); fn(); saveTasks(); render(); };
        return b;
      };
      actions.append(
        btn('🍅', 'Log 1 pomodoro done without the timer', () => logManual(t, 1, Date.now())),
        btn('✕', 'Delete task', () => { tasks.splice(i, 1); pickNextActive(t.cats); })
      );

      const grip = document.createElement('button');
      grip.type = 'button'; grip.className = 'grip'; grip.textContent = '⠿';
      grip.title = 'Drag to reorder (or focus and use ↑/↓)';
      grip.setAttribute('aria-label', 'Reorder ' + t.title);
      grip.onclick = (e) => e.stopPropagation();
      dragToReorder(grip, li);

      li.onclick = () => { if (!t.done) { activeId = t.id; saveTasks(); render(); } };
      li.append(grip, cb, main, count, actions);
      return li;
    }

    // Drag a task by its grip to reorder it within its group. Rows move live as you drag;
    // on drop, the group's new order is written back into `tasks`, leaving other tasks where they were.
    function dragToReorder(grip, li) {
      grip.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        e.preventDefault(); e.stopPropagation();
        const ul = li.parentElement;
        const before = [...ul.children].map(x => x.dataset.id).join();
        li.classList.add('dragging');
        let scrollTimer = null;
        const move = (ev) => {
          const y = ev.clientY;
          for (const sib of ul.children) {
            if (sib === li || !sib.dataset.id) continue;
            const r = sib.getBoundingClientRect();
            const mid = r.top + r.height / 2;
            const liBefore = li.compareDocumentPosition(sib) & Node.DOCUMENT_POSITION_FOLLOWING;
            if (liBefore && y > mid) { sib.after(li); break; }
            if (!liBefore && y < mid) { sib.before(li); break; }
          }
          // Scroll the page when dragging near the top or bottom edge.
          clearInterval(scrollTimer);
          const edge = 60, dy = y < edge ? -12 : y > innerHeight - edge ? 12 : 0;
          if (dy) scrollTimer = setInterval(() => { scrollBy(0, dy); move({ clientY: y }); }, 30);
        };
        const end = () => {
          clearInterval(scrollTimer);
          document.removeEventListener('pointermove', move);
          document.removeEventListener('pointerup', end);
          document.removeEventListener('pointercancel', end);
          li.classList.remove('dragging');
          const order = [...ul.children].map(x => x.dataset.id).filter(Boolean);
          if (order.join() !== before) applyOrder(order);
        };
        // Listen on the document: moving the row in the DOM would drop pointer capture on the grip.
        document.addEventListener('pointermove', move);
        document.addEventListener('pointerup', end);
        document.addEventListener('pointercancel', end);
      });
      // Keyboard: arrow keys move the task one place.
      grip.addEventListener('keydown', (e) => {
        if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
        e.preventDefault();
        const ul = li.parentElement;
        const sib = e.key === 'ArrowUp' ? li.previousElementSibling : li.nextElementSibling;
        if (!sib || !sib.dataset.id) return;
        if (e.key === 'ArrowUp') sib.before(li); else sib.after(li);
        applyOrder([...ul.children].map(x => x.dataset.id).filter(Boolean));
        const again = [...document.querySelectorAll('.task')].find(x => x.dataset.id === li.dataset.id && x.parentElement.dataset.group === ul.dataset.group);
        if (again) again.querySelector('.grip').focus();
      });
    }

    function applyOrder(ids) {
      const slots = tasks.map((t, k) => ids.includes(t.id) ? k : -1).filter(k => k >= 0);
      const moved = ids.map(id => tasks.find(t => t.id === id));
      slots.forEach((k, n) => { tasks[k] = moved[n]; });
      saveTasks(); render();
    }

    const sumLeft = (list) => list.filter(t => !t.done).reduce((n, t) => n + Math.max(0, t.est - t.spent), 0);

    function groupStatsText(el) {
      const cat = cats.find(c => c.id === el.dataset.cat) || null;
      const items = cat ? tasks.filter(t => hasCat(t, cat.id)) : tasks.filter(noCat);
      const planned = items.reduce((n, t) => n + t.est, 0);
      const spent = items.reduce((n, t) => n + t.spent, 0);
      el.textContent = (items.length ? spent + '/' + planned + ' 🍅 · ' + sumLeft(items) + ' left' : 'no tasks') +
        (cat && cat.logged ? ' · ' + cat.logged + ' total' : '');
    }

    function renderTasks() {
      renderProjects();
      const list = $('task-list');
      list.innerHTML = '';

      const groups = cats.map(c => ({ cat: c, items: tasks.filter(t => hasCat(t, c.id)) }));
      groups.push({ cat: null, items: tasks.filter(noCat) });
      const shown = groups.filter(g =>
        filterCat === 'all' ? g.items.length : (filterCat === 'none' ? !g.cat : g.cat && g.cat.id === filterCat));

      if (!shown.length || !shown.some(g => g.items.length || g.cat)) {
        list.innerHTML = '<p class="empty">Add tasks and estimate how many pomodoros each needs.</p>';
      }
      shown.forEach(g => {
        const sec = document.createElement('div');
        sec.className = 'group';
        const head = document.createElement('div');
        head.className = 'group-head';
        const dot = document.createElement('span'); dot.className = 'dot';
        if (g.cat) dot.style.background = g.cat.color;
        const name = document.createElement('span'); name.className = 'group-name';
        name.textContent = g.cat ? g.cat.name : 'No project';
        const stats = document.createElement('small');
        stats.className = 'group-stats';
        stats.dataset.cat = g.cat ? g.cat.id : '';
        groupStatsText(stats);
        stats.title = g.cat ? 'Done/planned for current tasks · all-time pomodoros logged to this project' : '';
        head.append(dot, name, stats);
        if (g.cat) {
          const mk = (label, aria, fn) => {
            const b = document.createElement('button'); b.type = 'button';
            b.textContent = label; b.title = aria; b.setAttribute('aria-label', aria); b.onclick = fn;
            return b;
          };
          head.append(mk('✎', 'Rename project', () => renameProject(g.cat)), mk('✕', 'Delete project', () => deleteProject(g.cat)));
        }
        const ul = document.createElement('ul');
        ul.dataset.group = g.cat ? g.cat.id : '';
        g.items.forEach(t => ul.append(taskItem(t, g.cat ? g.cat.id : null)));
        if (!g.items.length) ul.innerHTML = '<li class="empty">No tasks yet — add one above.</li>';
        sec.append(head, ul);
        list.append(sec);
      });

      $('clear-done').hidden = !tasks.some(t => t.done);
      renderPlanStats();
    }

    function renderPlanStats() {
      const scope = tasks.filter(inFilter);
      const left = sumLeft(scope);
      const planned = scope.reduce((n, t) => n + t.est, 0);
      const spent = scope.reduce((n, t) => n + t.spent, 0);
      $('plan-summary').textContent = scope.length ? spent + '/' + planned + ' 🍅 · ' + left + ' left' : '';
      $('finish-at').textContent = left ? 'Est. finish ' + estimateFinish(left) : (scope.length ? 'All planned work done 🎉' : '');
    }

    // Time to get through `left` focus sessions (plus the breaks between them), starting from the current timer.
    function estimateFinish(left) {
      let secs = remaining, n = done;
      let sessions = left;
      if (mode === 'work') { n++; sessions--; }       // the running focus session counts as one
      for (let k = 0; k < sessions; k++) {
        if (mode === 'work' || k > 0) secs += (n % settings.every === 0 ? settings.long : settings.short) * 60;
        secs += settings.work * 60;
        n++;
      }
      const at = new Date(Date.now() + secs * 1000);
      return at.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + ' (' + Math.round(secs / 60) + ' min)';
    }

    $('add-form').onsubmit = (e) => {
      e.preventDefault();
      const title = $('task-title').value.trim();
      const est = Math.min(20, Math.max(1, parseInt($('task-est').value, 10) || 1));
      const ids = [...newCats];
      if (!title) return;
      tasks.push({ id: uid(), title, est, spent: 0, done: false, cats: ids });
      // Keep the new task visible: switch the filter if it wouldn't show up.
      if (filterCat !== 'all' && !(filterCat === 'none' ? !ids.length : ids.includes(filterCat))) filterCat = 'all';
      pickNextActive(ids);
      $('task-title').value = ''; $('task-est').value = 1;
      saveTasks(); render();
    };
    $('clear-done').onclick = () => { tasks = tasks.filter(t => !t.done); saveTasks(); };

    remaining = total();
    pickNextActive();
    renderTasks();
    render();
  </script>
</body>
</html>
