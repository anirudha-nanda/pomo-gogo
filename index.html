<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomo Gogo</title>
  <meta name="description" content="A simple Pomodoro timer.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍅</text></svg>">
  <style>
    :root {
      --bg: #fdf6f3;
      --fg: #2b1d1a;
      --muted: #7a6560;
      --card: #ffffff;
      --accent: #d9483b;
      --track: #f0e2dd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1413;
        --fg: #f5ebe8;
        --muted: #b09a95;
        --card: #241c1a;
        --track: #3a2e2b;
      }
    }
    body.short { --accent: #3b9c6e; }
    body.long  { --accent: #3b6fd9; }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: background .3s;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      text-align: center;
    }
    h1 { margin: 0 0 20px; font-size: 1.4rem; }
    .modes { display: flex; gap: 6px; justify-content: center; margin-bottom: 24px; }
    .modes button {
      flex: 1;
      border: 0;
      padding: 8px 6px;
      border-radius: 999px;
      background: var(--track);
      color: var(--fg);
      font: inherit;
      font-size: .9rem;
      cursor: pointer;
    }
    .modes button[aria-pressed="true"] { background: var(--accent); color: #fff; }
    .ring { position: relative; width: 240px; height: 240px; margin: 0 auto 24px; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 10; }
    .ring .track { stroke: var(--track); }
    .ring .progress { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
    .time {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .time strong { font-size: 3.4rem; font-variant-numeric: tabular-nums; }
    .time span { color: var(--muted); font-size: .9rem; }
    #current-task { max-width: 170px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
    .controls { display: flex; gap: 10px; justify-content: center; }
    .controls button {
      border: 0; border-radius: 12px; padding: 12px 22px;
      font: inherit; font-weight: 600; cursor: pointer;
    }
    #start { background: var(--accent); color: #fff; min-width: 120px; }
    .secondary { background: var(--track); color: var(--fg); }
    details { margin-top: 24px; text-align: left; }
    summary { cursor: pointer; color: var(--muted); }
    .settings { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 12px; align-items: center; }
    .settings input[type=number] {
      width: 72px; padding: 6px; border-radius: 8px;
      border: 1px solid var(--track); background: var(--bg); color: var(--fg); font: inherit;
    }
    .env-badge {
      position: fixed; top: 0; left: 50%; transform: translateX(-50%);
      padding: 4px 14px; border-radius: 0 0 10px 10px;
      font-size: .75rem; font-weight: 700; letter-spacing: .08em; color: #fff;
    }
    .env-badge.dev { background: #7a3bd9; }
    .env-badge.sandbox { background: #d98a1b; }
    .count { margin-top: 18px; color: var(--muted); font-size: .9rem; }
    .tasks { margin-top: 24px; text-align: left; }
    .tasks h2 { font-size: 1rem; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline; }
    .tasks h2 small { color: var(--muted); font-weight: 400; font-size: .8rem; }
    .add { display: flex; gap: 6px; margin-bottom: 10px; }
    .add input {
      min-width: 0; padding: 8px; border-radius: 8px;
      border: 1px solid var(--track); background: var(--bg); color: var(--fg); font: inherit;
    }
    .add input[type=text] { flex: 1; }
    .add input[type=number] { width: 56px; }
    .add button, .task-actions button {
      border: 0; border-radius: 8px; background: var(--track); color: var(--fg);
      font: inherit; cursor: pointer;
    }
    .add button { padding: 8px 12px; background: var(--accent); color: #fff; font-weight: 600; }
    #task-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .task {
      display: flex; align-items: center; gap: 8px;
      padding: 10px; border-radius: 10px; border: 2px solid transparent; background: var(--bg);
      cursor: pointer;
    }
    .task.active { border-color: var(--accent); }
    .task.done .task-title { text-decoration: line-through; color: var(--muted); }
    .task input[type=checkbox] { flex: none; width: 18px; height: 18px; accent-color: var(--accent); }
    .task-title { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .task-count { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .task-count.over { color: var(--accent); }
    .task-actions { display: flex; gap: 4px; }
    .task-actions button { width: 26px; height: 26px; padding: 0; font-size: .9rem; }
    .empty { color: var(--muted); font-size: .9rem; text-align: center; padding: 8px; }
    .task-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; color: var(--muted); font-size: .85rem; flex-wrap: wrap; }
    .task-foot button { border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; padding: 0; }
  </style>
</head>
<body>
  <main>
    <h1>🍅 Pomo Gogo</h1>
    <div class="modes" role="group" aria-label="Mode">
      <button data-mode="work" aria-pressed="true">Focus</button>
      <button data-mode="short" aria-pressed="false">Short break</button>
      <button data-mode="long" aria-pressed="false">Long break</button>
    </div>
    <div class="ring">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="54"></circle>
        <circle class="progress" cx="60" cy="60" r="54"></circle>
      </svg>
      <div class="time">
        <strong id="clock" aria-live="polite">25:00</strong>
        <span id="label">Focus</span>
        <span id="current-task"></span>
      </div>
    </div>
    <div class="controls">
      <button id="start">Start</button>
      <button id="reset" class="secondary">Reset</button>
      <button id="skip" class="secondary" title="Skip to next">Skip</button>
    </div>
    <p class="count">Completed pomodoros: <span id="done">0</span></p>
    <section class="tasks" aria-label="Task plan">
      <h2>Plan <small id="plan-summary"></small></h2>
      <form class="add" id="add-form">
        <input id="task-title" type="text" placeholder="What are you working on?" aria-label="Task" required>
        <input id="task-est" type="number" min="1" max="20" value="1" aria-label="Estimated pomodoros" title="Estimated pomodoros">
        <button type="submit">Add</button>
      </form>
      <ul id="task-list"></ul>
      <div class="task-foot">
        <span id="finish-at"></span>
        <button id="clear-done" type="button">Clear finished</button>
      </div>
    </section>
    <details>
      <summary>Settings</summary>
      <div class="settings">
        <label for="s-work">Focus (min)</label><input id="s-work" type="number" min="1" max="120">
        <label for="s-short">Short break (min)</label><input id="s-short" type="number" min="1" max="60">
        <label for="s-long">Long break (min)</label><input id="s-long" type="number" min="1" max="60">
        <label for="s-every">Long break every</label><input id="s-every" type="number" min="2" max="10">
        <label for="s-auto">Auto-start next</label><input id="s-auto" type="checkbox">
      </div>
    </details>
  </main>

  <script>
    // Environment badge: DEV when served locally, SANDBOX on the sandbox Pages site, nothing on prod.
    const ENV = (() => {
      const h = location.hostname;
      const env = location.protocol === 'file:' || h === 'localhost' || h === '127.0.0.1' || h.endsWith('.local') ? 'dev'
        : location.pathname.startsWith('/pomo-gogo-sandbox') ? 'sandbox' : null;
      if (!env) return '';
      const b = document.createElement('div');
      b.className = 'env-badge ' + env;
      b.textContent = env.toUpperCase();
      document.body.prepend(b);
      return '[' + env.toUpperCase() + '] ';
    })();

    const LABELS = { work: 'Focus', short: 'Short break', long: 'Long break' };
    const DEFAULTS = { work: 25, short: 5, long: 15, every: 4, auto: false };

    function load(key, fallback) {
      try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; }
    }
    function save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    }

    const settings = { ...DEFAULTS, ...load('pomo-settings', {}) };
    let mode = 'work';
    let remaining = settings.work * 60;
    let endAt = null;
    let tick = null;
    let done = load('pomo-done', 0);
    let tasks = load('pomo-tasks', []);
    let activeId = load('pomo-active', null);

    const $ = (id) => document.getElementById(id);
    const progress = document.querySelector('.progress');
    const CIRC = 2 * Math.PI * 54;
    progress.style.strokeDasharray = CIRC;

    function total() { return settings[mode] * 60; }
    function fmt(s) {
      const m = Math.floor(s / 60), r = s % 60;
      return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
    }

    function render() {
      $('clock').textContent = fmt(remaining);
      $('label').textContent = LABELS[mode];
      $('done').textContent = done;
      const active = activeTask();
      $('current-task').textContent = active && mode === 'work' ? active.title : '';
      if ($('finish-at')) renderPlanStats();
      $('start').textContent = tick ? 'Pause' : 'Start';
      progress.style.strokeDashoffset = CIRC * (1 - remaining / total());
      document.body.className = mode === 'work' ? '' : mode;
      document.title = ENV + (tick ? fmt(remaining) + ' · ' : '') + LABELS[mode] + ' — Pomo Gogo';
      document.querySelectorAll('.modes button').forEach(b =>
        b.setAttribute('aria-pressed', b.dataset.mode === mode));
    }

    function start() {
      if (tick) return;
      endAt = Date.now() + remaining * 1000;
      tick = setInterval(step, 250);
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
      render();
    }
    function pause() {
      clearInterval(tick);
      tick = null;
      render();
    }
    function step() {
      remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000));
      if (remaining === 0) finish();
      else render();
    }

    function setMode(m) {
      pause();
      mode = m;
      remaining = total();
      render();
    }

    function next() {
      if (mode === 'work') {
        setMode(done % settings.every === 0 && done > 0 ? 'long' : 'short');
      } else {
        setMode('work');
      }
    }

    function finish() {
      const finished = mode;
      if (finished === 'work') {
        done++; save('pomo-done', done);
        const active = activeTask();
        if (active) { active.spent++; saveTasks(); }
      }
      beep();
      notify(finished === 'work' ? 'Focus session done — take a break!' : 'Break over — back to focus!');
      next();
      if (settings.auto) start();
    }

    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.35, 0.7].forEach(t => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.frequency.value = 880;
          g.gain.setValueAtTime(0.2, ctx.currentTime + t);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.3);
          o.connect(g).connect(ctx.destination);
          o.start(ctx.currentTime + t);
          o.stop(ctx.currentTime + t + 0.3);
        });
      } catch {}
    }
    function notify(text) {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('Pomo Gogo', { body: text });
      }
    }

    $('start').onclick = () => (tick ? pause() : start());
    $('reset').onclick = () => setMode(mode);
    $('skip').onclick = () => next();
    document.querySelectorAll('.modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));

    const fields = { work: 's-work', short: 's-short', long: 's-long', every: 's-every' };
    for (const [key, id] of Object.entries(fields)) {
      const el = $(id);
      el.value = settings[key];
      el.onchange = () => {
        const v = parseInt(el.value, 10);
        if (!(v >= +el.min && v <= +el.max)) { el.value = settings[key]; return; }
        settings[key] = v;
        save('pomo-settings', settings);
        if (!tick && key === mode) { remaining = total(); render(); }
      };
    }
    $('s-auto').checked = settings.auto;
    $('s-auto').onchange = (e) => { settings.auto = e.target.checked; save('pomo-settings', settings); };

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
        e.preventDefault();
        tick ? pause() : start();
      }
    });

    // ---- Task plan ----
    function activeTask() { return tasks.find(t => t.id === activeId && !t.done) || null; }
    function saveTasks() { save('pomo-tasks', tasks); save('pomo-active', activeId); renderTasks(); }
    function pickNextActive() {
      if (!activeTask()) activeId = (tasks.find(t => !t.done) || {}).id ?? null;
    }

    function renderTasks() {
      const list = $('task-list');
      list.innerHTML = '';
      if (!tasks.length) {
        list.innerHTML = '<li class="empty">Add tasks and estimate how many pomodoros each needs.</li>';
      }
      tasks.forEach((t, i) => {
        const li = document.createElement('li');
        li.className = 'task' + (t.id === activeId && !t.done ? ' active' : '') + (t.done ? ' done' : '');
        li.title = t.done ? '' : 'Click to make this the current task';

        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = t.done; cb.setAttribute('aria-label', 'Mark finished');
        cb.onclick = (e) => e.stopPropagation();
        cb.onchange = () => { t.done = cb.checked; pickNextActive(); saveTasks(); render(); };

        const title = document.createElement('span');
        title.className = 'task-title'; title.textContent = t.title;

        const count = document.createElement('span');
        count.className = 'task-count' + (t.spent > t.est ? ' over' : '');
        count.textContent = t.spent + '/' + t.est + ' 🍅';

        const actions = document.createElement('span');
        actions.className = 'task-actions';
        const btn = (label, aria, fn) => {
          const b = document.createElement('button');
          b.type = 'button'; b.textContent = label; b.setAttribute('aria-label', aria); b.title = aria;
          b.onclick = (e) => { e.stopPropagation(); fn(); saveTasks(); render(); };
          return b;
        };
        actions.append(
          btn('−', 'Decrease estimate', () => { t.est = Math.max(1, t.est - 1); }),
          btn('+', 'Increase estimate', () => { t.est = Math.min(20, t.est + 1); }),
          btn('↑', 'Move up', () => { if (i > 0) [tasks[i - 1], tasks[i]] = [tasks[i], tasks[i - 1]]; }),
          btn('✕', 'Delete task', () => { tasks.splice(i, 1); pickNextActive(); })
        );

        li.onclick = () => { if (!t.done) { activeId = t.id; saveTasks(); render(); } };
        li.append(cb, title, count, actions);
        list.append(li);
      });

      $('clear-done').hidden = !tasks.some(t => t.done);
      renderPlanStats();
    }

    function renderPlanStats() {
      const left = tasks.filter(t => !t.done).reduce((n, t) => n + Math.max(0, t.est - t.spent), 0);
      const planned = tasks.reduce((n, t) => n + t.est, 0);
      const spent = tasks.reduce((n, t) => n + t.spent, 0);
      $('plan-summary').textContent = tasks.length ? spent + '/' + planned + ' 🍅 · ' + left + ' left' : '';
      $('finish-at').textContent = left ? 'Est. finish ' + estimateFinish(left) : (tasks.length ? 'All planned work done 🎉' : '');
    }

    // Time to get through `left` focus sessions (plus the breaks between them), starting from the current timer.
    function estimateFinish(left) {
      let secs = remaining, n = done;
      let sessions = left;
      if (mode === 'work') { n++; sessions--; }       // the running focus session counts as one
      for (let k = 0; k < sessions; k++) {
        if (mode === 'work' || k > 0) secs += (n % settings.every === 0 ? settings.long : settings.short) * 60;
        secs += settings.work * 60;
        n++;
      }
      const at = new Date(Date.now() + secs * 1000);
      return at.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + ' (' + Math.round(secs / 60) + ' min)';
    }

    $('add-form').onsubmit = (e) => {
      e.preventDefault();
      const title = $('task-title').value.trim();
      const est = Math.min(20, Math.max(1, parseInt($('task-est').value, 10) || 1));
      if (!title) return;
      tasks.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title, est, spent: 0, done: false });
      pickNextActive();
      $('task-title').value = ''; $('task-est').value = 1;
      saveTasks(); render();
    };
    $('clear-done').onclick = () => { tasks = tasks.filter(t => !t.done); saveTasks(); };

    remaining = total();
    pickNextActive();
    renderTasks();
    render();
  </script>
</body>
</html>
